# Workflow de CI para PR a main
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar que la versión no existe como release
        run: |
          # Extraer la versión del pyproject.toml usando make get-version
          VERSION=$(make get-version)
          echo "Versión encontrada en pyproject.toml: $VERSION"
          
          # Verificar si ya existe un release con esta versión
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "❌ Error: La versión v$VERSION ya existe como release en GitHub"
            echo "Por favor, actualiza la versión en pyproject.toml antes de hacer el merge"
            exit 1
          else
            echo "✅ La versión v$VERSION no existe como release, continuando..."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Instalar dependencias de desarrollo
        run: |
          make install-full

      - name: Análisis de calidad de código (linters)
        run: |
          make quality

      - name: Ejecutar tests
        run: |
          make test-cov

