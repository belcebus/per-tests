# Workflow de CI para PR a main
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de desarrollo
        run: |
          make install-dev

      - name: Ejecutar tests
        run: |
          make test-cov

